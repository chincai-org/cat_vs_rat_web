<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Cat vs Rat</title>
		<link rel="icon" href="Assets/Cat_Avatar_Rounded.png">
		<link rel="preload" href="cat_vs_rat.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" fetchpriority="high">
		<link rel="preload" href="Assets/font.ttf" as="fetch" type="font/ttf" crossorigin="anonymous" fetchpriority="high">
		<style>
			html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: absolute; background: #000; z-index: 0; }
			canvas:focus { outline: none; }
			#share-status { position: fixed; right: 8px; bottom: 8px; z-index: 5; display: none; pointer-events: none;
				font: 14px sans-serif; padding: 8px 12px; color: #fff; background: #222;
				border-radius: 6px; }
			#loading { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
				pointer-events: none; color: #eee; background: #000;
				font: 20px sans-serif; letter-spacing: 0.04em; }
		</style>
	</head>
	<body>
		<canvas id="glcanvas" tabindex="1"></canvas>
		<div id="loading" role="status">Loading…</div>
		<div id="share-status" role="status" aria-live="polite"></div>

		<script>
			const KEY_IN = "catvsrat.incoming";
			const KEY_URL_MAP = "catvsrat.url_map";
			const KEY_DEBUG = "catvsrat.debug";
			(function () {
				try {
					const params = new URLSearchParams(location.search);
					const map = params.get("map");
					if (map) localStorage.setItem(KEY_URL_MAP, map);
					const debug = params.get("debug");
					localStorage.setItem(KEY_DEBUG,
						params.has("debug") && !/^(0|false|off)$/i.test(debug ?? "") ? "1" : "0");
				} catch (e) {}

				const m = /^#m=([A-Za-z0-9_-]+)$/.exec(location.hash);
				if (!m) return;
				try { localStorage.setItem(KEY_IN, m[1]); } catch (e) {}
				history.replaceState(null, "", location.pathname + location.search);
			})();
		</script>


		<script src="mq_js_bundle.js"></script>
		<script src="sapp_jsutils.js"></script>
		<script src="quad-storage.js"></script>
		<script>
			const status = document.getElementById("share-status");
			let statusTimer = 0;
			const hideStatus = () => {
				status.style.display = "none";
				status.textContent = "";
			};
			const showStatus = (message) => {
				clearTimeout(statusTimer);
				status.style.display = "block";
				status.textContent = message;
				statusTimer = setTimeout(hideStatus, 4000);
			};
			const decodeWasmText = (ptr, len) =>
				new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len));

			importObject.env.cat_vs_rat_ready = () => {
				document.getElementById("loading").style.display = "none";
			};

			importObject.env.cat_vs_rat_copy_share_link = async (ptr, len) => {
				const token = decodeWasmText(ptr, len);
				const link = location.origin + location.pathname + "#m=" + token;
				showStatus("Copying share link...");
				try {
					await navigator.clipboard.writeText(link);
					showStatus("Share link copied.");
				} catch (error) {
					console.error("Clipboard copy failed:", error);
					showStatus(`Copy failed: ${error?.name ?? "unknown error"}.`);
				}
			};
			importObject.env.cat_vs_rat_copy_map = async (ptr, len) => {
				showStatus("Copying map text...");
				try {
					await navigator.clipboard.writeText(decodeWasmText(ptr, len));
					showStatus("Map text copied.");
				} catch (error) {
					console.error("Clipboard copy failed:", error);
					showStatus(`Copy failed: ${error?.name ?? "unknown error"}.`);
				}
			};
			importObject.env.cat_vs_rat_paste_map = async () => {
				showStatus("Reading map from clipboard...");
				try {
					const text = await navigator.clipboard.readText();
					// An empty key tells Rust the read was cancelled, not malformed.
					localStorage.setItem("catvsrat.import_map", text);
					showStatus(text.trim() ? "Map received; importing..." : "Clipboard is empty.");
				} catch (error) {
					console.error("Clipboard read failed:", error);
					// Tell Rust the read ended instead of leaving it waiting forever.
					try { localStorage.setItem("catvsrat.import_map", ""); } catch (e) {}
					showStatus(`Paste failed: ${error?.name ?? "unknown error"}.`);
				}
			};

			// The game uses right-click as an eraser and Ctrl+S/Z/Y as editor keys.
			window.addEventListener("contextmenu", (event) => event.preventDefault());
			window.addEventListener("keydown", (event) => {
				if (!(event.ctrlKey || event.metaKey)) return;
				const key = event.key.toLowerCase();
				if (key === "s" || key === "z" || key === "y") event.preventDefault();
			}, { capture: true });

			load("cat_vs_rat.wasm");
		</script>
	</body>
</html>
